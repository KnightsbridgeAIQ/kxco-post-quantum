name: publish

# Triggered by pushing a v* tag (e.g. v1.1.1), or manually via the Actions
# UI / GitHub API by dispatching with a tag name.
#
# Auth path: npm Trusted Publishing via GitHub Actions OIDC.
# Registered at https://www.npmjs.com/package/kxco-post-quantum/access
# binding org=KnightsbridgeAIQ, repo=kxco-post-quantum, workflow=publish.yml.
# No NPM_TOKEN secret. No NPM_OTP. Nothing rotates, nothing leaks.
# Provenance is minted automatically by the OIDC publish.
#
# The repositories moved from JackKXCO to KnightsbridgeAIQ. Until the npm
# Trusted Publishing binding is repointed at the new org, this workflow cannot
# authenticate, and publishing by hand from a workstation produces a release
# with NO provenance attestation. Verify with:
#
#   npm view kxco-post-quantum --json | grep -A5 attestations
#
# A release with no attestations block was not published through this path.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v1.1.1)'
        required: true
        type: string

# Read-only by default. The one job that needs to write raises exactly what
# it needs, so a compromised action in any other step cannot reach further
# than reading the checkout.
permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node 26 with npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 because its bundled npm (11.20 on 26.11) already carries
          # Trusted Publishing's OIDC support, which arrived in npm 11.5.1. On
          # Node 22 the bundled npm is older and had to be replaced with
          # `npm install -g npm@11`, a download OpenSSF Scorecard can never count
          # as pinned (only `npm ci` passes its check). Using the npm the runtime
          # ships removes that download instead of hiding it.
          node-version: '26'
          # registry-url is what Scorecard's Packaging check looks for. An
          # earlier note here said it made npm skip the OIDC exchange; on the
          # current npm 11 line it does not. kxco-pq-attest, kxco-pq-hsm,
          # kxco-pq-audit and kxco-pq-sdk use this exact setup-node commit with
          # registry-url and no token of any kind, and all four published through
          # Trusted Publishing with provenance on 29 Sep 2026.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Node 26 puts the maths on OpenSSL. The JavaScript backend, which Node 22
      # and every browser run, is pinned here for a second pass so the
      # release gate still exercises both implementations, as it did when this
      # job ran on Node 22.
      - name: Run tests on the JavaScript backend
        env:
          KXCO_PQ_BACKEND: javascript
        run: npm test

      # The module at kxco-post-quantum/fips refuses to run without a manifest of
      # its own files signed with the ML-DSA-87 release key. The manifest is built
      # from this exact tree and signed here, immediately before publishing. The
      # seed is visible to this one step only, and the step refuses to fall back
      # to the ML-DSA-65 key, which the module would not accept.
      - name: Sign the FIPS module's integrity manifest
        env:
          KXCO_RELEASE_SEED_87: ${{ secrets.KXCO_RELEASE_SEED_87 }}
        run: |
          test -n "$KXCO_RELEASE_SEED_87" || { echo "KXCO_RELEASE_SEED_87 is not set"; exit 1; }
          node scripts/build-fips-manifest.mjs
          node scripts/sign-release.mjs src/fips/integrity.json

      # A signed module that cannot pass its own self-tests must not ship.
      - name: Prove the signed FIPS module starts
        run: |
          node --input-type=module -e "
            const fips = await import('./src/fips/index.js')
            const s = fips.status()
            console.log(JSON.stringify(s))
            if (s.state !== 'operational') process.exit(1)
          "

      - name: Publish (Trusted Publishing + provenance via OIDC)
        run: npm publish --provenance --access public

      # The SBOM runs AFTER the publish, and cannot fail the job. It is a useful
      # artefact, not a release gate. Generating it first meant an unrelated
      # problem here -- a stray line on stdout, or a flag changing under
      # `npm@latest`, which is deliberately unpinned above -- would block the
      # release itself. A missing SBOM is worth an amber run; a blocked publish
      # is not.
      - name: Generate CycloneDX SBOM
        continue-on-error: true
        # npm generates this itself, so the SBOM describes the tree that was
        # actually installed for this build rather than a re-resolved one.
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type library > sbom.cyclonedx.json
          node -e "const s=require('./sbom.cyclonedx.json');console.log('components:',s.components.length)"

      - name: Keep the SBOM as a build artifact
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.event.inputs.ref || github.ref_name }}
          path: sbom.cyclonedx.json

      # Publish the SBOM at a stable, unauthenticated URL:
      #   https://github.com/<org>/<repo>/releases/download/<tag>/sbom.cyclonedx.json
      #
      # gh is preinstalled on the runner, so this adds no third-party action to
      # pin. Like the steps above it cannot fail the job: the package is already
      # published by this point and failing here would misreport a completed
      # release. --clobber makes a re-dispatch of the same tag idempotent.
      - name: Publish the SBOM on the GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        # Created as a DRAFT. evidence.yml publishes it once the bundle is
        # attached. Without that, releases/latest moves the moment this job
        # finishes, while the evidence build is still running, so the
        # manifest URL the README calls permanent 404s on every release.
        # A draft is skipped by releases/latest, so the previous good release
        # keeps serving until the new one actually has its evidence.
        run: |
          gh release view "$TAG" >/dev/null 2>&1             || gh release create "$TAG" --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" sbom.cyclonedx.json --clobber
